<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c4cf5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Gifts">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Family Gift Cards</title>
<style>
  :root {
    --accent: #6c4cf5;
    --bg: #f6f5fb;
    --card: #ffffff;
    --text: #1d1b26;
    --muted: #6b6880;
    --line: #e4e2ee;
    --ok: #1f9d55;
    --warn: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14131a; --card: #1f1d28; --text: #f2f1f7; --muted: #a3a0b5; --line: #302d3d; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
  }
  header {
    background: var(--accent); color: #fff; padding: 18px 16px 14px;
    padding-top: calc(18px + env(safe-area-inset-top));
  }
  header h1 { margin: 0; font-size: 1.3rem; }
  header p { margin: 2px 0 0; opacity: .85; font-size: .9rem; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 1.1rem; margin: 20px 0 10px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > * { flex: 1; }
  .spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea {
    width: 100%; padding: 11px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }
  input[type=color] { padding: 2px; height: 44px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 14px;
    background: var(--accent); color: #fff; cursor: pointer; min-height: 44px;
  }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button.danger { background: transparent; color: var(--warn); border: 1px solid var(--line); }
  button.small { padding: 6px 10px; min-height: 34px; font-size: .85rem; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .muted { color: var(--muted); font-size: .9rem; }
  .empty { text-align: center; color: var(--muted); padding: 20px 8px; }
  .kid { display: flex; align-items: center; gap: 12px; }
  .avatar { font-size: 2rem; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%; background: var(--bg); flex: 0 0 52px; }
  .points { font-weight: 700; font-size: 1.2rem; }
  .gcard {
    color: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; position: relative;
    min-height: 130px; display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 6px 18px rgba(0,0,0,.12);
  }
  .gcard .emoji { font-size: 2rem; }
  .gcard .title { font-weight: 700; font-size: 1.15rem; }
  .gcard .cost { position: absolute; top: 14px; right: 14px; background: rgba(0,0,0,.22); padding: 4px 10px; border-radius: 99px; font-weight: 700; }
  .gcard .code { font-family: ui-monospace, monospace; letter-spacing: 1px; opacity: .9; font-size: .85rem; }
  .gcard button { background: rgba(255,255,255,.95); color: #222; }
  .tag { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .list-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list-item:last-child { border-bottom: 0; }
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 5;
  }
  nav button {
    flex: 1; background: transparent; color: var(--muted); border-radius: 0; font-size: .75rem;
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px; min-height: 60px;
  }
  nav button span { font-size: 1.35rem; }
  nav button.active { color: var(--accent); }
  .bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }
  .toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #222; color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: .9rem; z-index: 20; max-width: 90vw; text-align: center;
  }
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(420px, 92vw); background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog .panel { border: 0; margin: 0; }
  .pinpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .pinpad button { font-size: 1.3rem; background: var(--bg); color: var(--text); border: 1px solid var(--line); }
  .dots { text-align: center; font-size: 1.6rem; letter-spacing: 8px; min-height: 2rem; }
  .emoji-pick { display: flex; flex-wrap: wrap; gap: 6px; }
  .emoji-pick button { background: var(--bg); border: 1px solid var(--line); font-size: 1.4rem; padding: 4px 8px; min-height: 40px; }
  .emoji-pick button.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
</style>
</head>
<body>
<header>
  <h1 id="appTitle">Family Gift Cards</h1>
  <p id="appSub">Earn Peace Points, trade them for gift cards</p>
</header>
<main id="view"></main>

<nav id="nav">
  <button data-tab="home"><span>🏠</span>Home</button>
  <button data-tab="cards"><span>🎁</span>Cards</button>
  <button data-tab="peace"><span>🕊️</span>Peace</button>
  <button data-tab="parent"><span>🔒</span>Parent</button>
  <button data-tab="settings"><span>⚙️</span>Setup</button>
</nav>

<dialog id="pinDialog">
  <div class="panel">
    <h2 style="margin-top:0" id="pinTitle">Parent PIN</h2>
    <div class="dots" id="pinDots"></div>
    <div class="pinpad" id="pinPad"></div>
    <div class="row" style="margin-top:10px">
      <button class="ghost" id="pinCancel">Cancel</button>
    </div>
  </div>
</dialog>

<script>
(() => {
  'use strict';

  // ---------- Constants ----------
  const STORE_KEY = 'familyGiftCards.v1';
  const MAX_AGE = 15;                               // kids profiles are for ages 1–15
  const MIN_AGE = 1;
  const STORAGE_CAP = 1024 * 1024 * 1024 - 1;       // stay under 1 GB
  const APP_DATA_WARN = 4 * 1024 * 1024;            // localStorage usually tops out near 5 MB
  const AVATARS = ['🦁','🐯','🐼','🦊','🐸','🐵','🦄','🐙','🐢','🐬','🚀','⚽','🎨','🎸','🌟','🌈'];
  const CARD_EMOJI = ['🎁','🍦','🎮','📚','🍕','🎬','🧸','🛝','🎟️','🛍️','🏊','🌙','📱','🎨'];
  const PEACE_ACTS = [
    { label: 'Shared with a sibling', pts: 5 },
    { label: 'Said sorry & made up', pts: 10 },
    { label: 'Helped without being asked', pts: 10 },
    { label: 'Solved a fight calmly', pts: 15 },
    { label: 'Did chores', pts: 5 },
    { label: 'Kind words all day', pts: 10 },
  ];

  const defaults = () => ({
    settings: {
      familyName: 'Our Family',
      appTitle: 'Family Gift Cards',
      tagline: 'Earn Peace Points, trade them for gift cards',
      accent: '#6c4cf5',
      pin: '',                // empty = not set yet
      pointsName: 'Peace Points',
    },
    kids: [],                 // {id, name, age, avatar, points}
    cards: [],                // {id, title, emoji, cost, color, minAge, maxAge, stock (-1 = unlimited), note}
    wallet: [],               // {id, kidId, cardId, title, emoji, color, code, at, used}
    log: [],                  // {id, kidId, text, pts, at}
    peaceActs: PEACE_ACTS,
  });

  // ---------- State ----------
  let state = load();
  let tab = 'home';
  let parentUnlocked = false;

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return defaults();
      const d = JSON.parse(raw);
      const base = defaults();
      return { ...base, ...d, settings: { ...base.settings, ...(d.settings || {}) } };
    } catch { return defaults(); }
  }
  function save() {
    const json = JSON.stringify(state);
    if (json.length * 2 > STORAGE_CAP) { toast('Too much data — export a backup and clear old history.'); return false; }
    try { localStorage.setItem(STORE_KEY, json); return true; }
    catch { toast('Phone storage for this app is full. Clear history in Setup.'); return false; }
  }

  // ---------- Helpers ----------
  const $ = s => document.querySelector(s);
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const kidById = id => state.kids.find(k => k.id === id);
  const cardById = id => state.cards.find(c => c.id === id);
  const fmtDate = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const fmtBytes = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : b < 1073741824 ? (b/1048576).toFixed(1) + ' MB' : (b/1073741824).toFixed(2) + ' GB';
  const giftCode = () => Array.from({ length: 3 }, () => Math.random().toString(36).slice(2, 6).toUpperCase()).join('-');
  const pts = () => esc(state.settings.pointsName);

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }
  function addLog(kidId, text, p) {
    state.log.unshift({ id: uid(), kidId, text, pts: p, at: Date.now() });
    if (state.log.length > 500) state.log.length = 500;   // keep history small
  }
  function applyTheme() {
    const s = state.settings;
    document.documentElement.style.setProperty('--accent', s.accent);
    document.querySelector('meta[name=theme-color]').setAttribute('content', s.accent);
    $('#appTitle').textContent = s.appTitle;
    $('#appSub').textContent = s.familyName + ' · ' + s.tagline;
    document.title = s.appTitle;
  }

  // ---------- PIN ----------
  function askPin(title) {
    return new Promise(resolve => {
      const dlg = $('#pinDialog');
      let entry = '';
      $('#pinTitle').textContent = title;
      const dots = () => $('#pinDots').textContent = '•'.repeat(entry.length) || ' ';
      const pad = $('#pinPad');
      pad.innerHTML = '';
      ['1','2','3','4','5','6','7','8','9','⌫','0','OK'].forEach(k => {
        const b = document.createElement('button');
        b.textContent = k;
        b.onclick = () => {
          if (k === '⌫') entry = entry.slice(0, -1);
          else if (k === 'OK') { dlg.close(); resolve(entry); return; }
          else if (entry.length < 6) entry += k;
          dots();
        };
        pad.appendChild(b);
      });
      $('#pinCancel').onclick = () => { dlg.close(); resolve(null); };
      dots();
      dlg.showModal();
    });
  }
  async function unlockParent() {
    if (parentUnlocked) return true;
    if (!state.settings.pin) {
      const p1 = await askPin('Create a 4–6 digit parent PIN');
      if (!p1) return false;
      if (p1.length < 4) { toast('PIN needs at least 4 digits'); return false; }
      const p2 = await askPin('Type the PIN again');
      if (p1 !== p2) { toast('PINs did not match'); return false; }
      state.settings.pin = p1; save();
      parentUnlocked = true; toast('Parent PIN saved'); return true;
    }
    const p = await askPin('Parent PIN');
    if (p === state.settings.pin) { parentUnlocked = true; return true; }
    if (p !== null) toast('Wrong PIN');
    return false;
  }

  // ---------- Views ----------
  const views = {
    home() {
      if (!state.kids.length) {
        return `<div class="panel empty">
          <div style="font-size:3rem">👨‍👩‍👧‍👦</div>
          <p>No kids added yet.</p>
          <p class="muted">Go to <b>Parent</b> to add kids (ages ${MIN_AGE}–${MAX_AGE}) and make gift cards.</p>
        </div>`;
      }
      return `<h2>Our kids</h2>` + state.kids.map(k => {
        const mine = state.wallet.filter(w => w.kidId === k.id && !w.used).length;
        return `<div class="panel">
          <div class="kid">
            <div class="avatar">${esc(k.avatar)}</div>
            <div style="flex:1">
              <div style="font-weight:700">${esc(k.name)} <span class="tag">age ${k.age}</span></div>
              <div class="muted">${mine} gift card${mine === 1 ? '' : 's'} in wallet</div>
            </div>
            <div style="text-align:right"><div class="points">${k.points}</div><div class="muted" style="font-size:.75rem">${pts()}</div></div>
          </div>
          <div class="row" style="margin-top:10px">
            <button class="ghost small" data-act="openWallet" data-id="${k.id}">Wallet</button>
            <button class="small" data-act="goShop" data-id="${k.id}">Get a gift card</button>
          </div>
        </div>`;
      }).join('') + recentLog();
    },

    cards() {
      const kidSel = state.kids.length ? `<label>Shopping as</label>
        <select id="shopKid">${state.kids.map(k => `<option value="${k.id}" ${k.id === shopKid ? 'selected' : ''}>${esc(k.avatar)} ${esc(k.name)} — ${k.points} pts</option>`).join('')}</select>` : '';
      const kid = kidById(shopKid) || state.kids[0];
      if (kid) shopKid = kid.id;
      const list = state.cards;
      if (!state.cards.length) return kidSel + `<div class="panel empty"><div style="font-size:3rem">🎁</div><p>No gift cards yet.</p><p class="muted">A parent can create them in <b>Parent</b>.</p></div>`;
      return kidSel + `<h2>Gift card shop</h2>` + list.map(c => {
        const tooYoung = kid && c.minAge && kid.age < c.minAge;
        const tooOld = kid && c.maxAge && kid.age > c.maxAge;
        const soldOut = c.stock === 0;
        const cant = !kid || kid.points < c.cost || tooYoung || tooOld || soldOut;
        let why = '';
        if (soldOut) why = 'Sold out';
        else if (tooYoung || tooOld) why = `Ages ${c.minAge || MIN_AGE}–${c.maxAge || MAX_AGE}`;
        else if (kid && kid.points < c.cost) why = `Need ${c.cost - kid.points} more`;
        return `<div class="gcard" style="background:${esc(c.color)}">
          <div class="cost">${c.cost} pts</div>
          <div class="emoji">${esc(c.emoji)}</div>
          <div>
            <div class="title">${esc(c.title)}</div>
            ${c.note ? `<div style="opacity:.9;font-size:.9rem">${esc(c.note)}</div>` : ''}
            <div class="spread" style="margin-top:8px">
              <span style="font-size:.8rem;opacity:.9">${c.stock === -1 ? 'Unlimited' : c.stock + ' left'} · ages ${c.minAge || MIN_AGE}–${c.maxAge || MAX_AGE}</span>
              <button class="small" data-act="redeem" data-id="${c.id}" ${cant ? 'disabled' : ''}>${cant && why ? why : 'Get it'}</button>
            </div>
          </div>
        </div>`;
      }).join('');
    },

    peace() {
      if (!state.kids.length) return `<div class="panel empty">Add kids in <b>Parent</b> first.</div>`;
      return `<div class="panel">
          <h2 style="margin-top:0">🕊️ Peace Board</h2>
          <p class="muted">Getting along earns ${pts()}. A parent approves each one with the PIN.</p>
          <label>Who?</label>
          <select id="peaceKid">${state.kids.map(k => `<option value="${k.id}">${esc(k.avatar)} ${esc(k.name)}</option>`).join('')}</select>
          <label>What happened?</label>
          <div id="peaceActs">${state.peaceActs.map((a, i) => `
            <button class="ghost" style="width:100%;margin-bottom:6px;text-align:left" data-act="peace" data-i="${i}">
              <span class="spread"><span>${esc(a.label)}</span><b>+${a.pts}</b></span>
            </button>`).join('')}
          </div>
        </div>
        <div class="panel">
          <h2 style="margin-top:0">🤝 Make peace together</h2>
          <p class="muted">Two kids made up after a fight? Both get a bonus.</p>
          <div class="row">
            <select id="peaceA">${state.kids.map(k => `<option value="${k.id}">${esc(k.name)}</option>`).join('')}</select>
            <select id="peaceB">${state.kids.map((k, i) => `<option value="${k.id}" ${i === 1 ? 'selected' : ''}>${esc(k.name)}</option>`).join('')}</select>
          </div>
          <button style="width:100%;margin-top:10px" data-act="makePeace">We made peace (+10 each)</button>
        </div>` + recentLog();
    },

    parent() {
      if (!parentUnlocked) {
        return `<div class="panel empty"><div style="font-size:3rem">🔒</div>
          <p>Parents only.</p>
          <button data-act="unlock">${state.settings.pin ? 'Enter PIN' : 'Create parent PIN'}</button></div>`;
      }
      return `
      <div class="spread"><h2>Kids (ages ${MIN_AGE}–${MAX_AGE})</h2><button class="ghost small" data-act="lock">Lock</button></div>
      <div class="panel">
        ${state.kids.map(k => `<div class="list-item spread">
          <span>${esc(k.avatar)} <b>${esc(k.name)}</b> <span class="tag">age ${k.age}</span> <span class="muted">${k.points} pts</span></span>
          <span style="display:flex;gap:6px;flex:0 0 auto">
            <button class="ghost small" data-act="adjust" data-id="${k.id}">± pts</button>
            <button class="ghost small" data-act="editKid" data-id="${k.id}">Edit</button>
          </span></div>`).join('') || '<p class="muted">No kids yet.</p>'}
        <h3 style="font-size:1rem;margin:14px 0 0">Add a kid</h3>
        <div class="row">
          <div><label>Name</label><input id="kName" maxlength="24" placeholder="Name"></div>
          <div style="flex:0 0 90px"><label>Age</label><input id="kAge" type="number" min="${MIN_AGE}" max="${MAX_AGE}" inputmode="numeric" placeholder="${MIN_AGE}-${MAX_AGE}"></div>
        </div>
        <label>Avatar</label>
        <div class="emoji-pick" id="kAvatar">${AVATARS.map((a, i) => `<button type="button" class="${i === 0 ? 'sel' : ''}" data-v="${a}">${a}</button>`).join('')}</div>
        <button style="width:100%;margin-top:12px" data-act="addKid">Add kid</button>
      </div>

      <h2>Make a gift card</h2>
      <div class="panel">
        <label>Name of the gift card</label>
        <input id="cTitle" maxlength="40" placeholder="e.g. Ice cream trip, 1 hr video games, $10 store card">
        <label>Note (optional)</label>
        <input id="cNote" maxlength="80" placeholder="e.g. Weekends only">
        <div class="row">
          <div><label>Cost (pts)</label><input id="cCost" type="number" min="1" value="50" inputmode="numeric"></div>
          <div><label>How many (0 = unlimited)</label><input id="cStock" type="number" min="0" value="0" inputmode="numeric"></div>
        </div>
        <div class="row">
          <div><label>From age</label><input id="cMin" type="number" min="${MIN_AGE}" max="${MAX_AGE}" value="${MIN_AGE}" inputmode="numeric"></div>
          <div><label>To age</label><input id="cMax" type="number" min="${MIN_AGE}" max="${MAX_AGE}" value="${MAX_AGE}" inputmode="numeric"></div>
          <div><label>Color</label><input id="cColor" type="color" value="${esc(state.settings.accent)}"></div>
        </div>
        <label>Picture</label>
        <div class="emoji-pick" id="cEmoji">${CARD_EMOJI.map((a, i) => `<button type="button" class="${i === 0 ? 'sel' : ''}" data-v="${a}">${a}</button>`).join('')}</div>
        <button style="width:100%;margin-top:12px" data-act="addCard">Create gift card</button>
      </div>

      <div class="panel">
        <h3 style="font-size:1rem;margin:0 0 6px">Gift cards in the shop</h3>
        ${state.cards.map(c => `<div class="list-item spread">
          <span>${esc(c.emoji)} ${esc(c.title)} <span class="muted">${c.cost} pts · ages ${c.minAge}–${c.maxAge}</span></span>
          <button class="danger small" data-act="delCard" data-id="${c.id}">Remove</button></div>`).join('') || '<p class="muted">None yet.</p>'}
      </div>

      <h2>Cards waiting to be used</h2>
      <div class="panel">
        ${state.wallet.filter(w => !w.used).map(w => `<div class="list-item spread">
          <span>${esc(w.emoji)} ${esc(w.title)}<br><span class="muted">${esc(kidById(w.kidId)?.name || '?')} · ${esc(w.code)}</span></span>
          <button class="small" data-act="markUsed" data-id="${w.id}">Mark used</button></div>`).join('') || '<p class="muted">Nothing waiting.</p>'}
      </div>`;
    },

    settings() {
      const s = state.settings;
      return `<h2>Customize the app</h2>
      <div class="panel">
        <label>App name</label><input id="sTitle" maxlength="30" value="${esc(s.appTitle)}">
        <label>Family name</label><input id="sFamily" maxlength="30" value="${esc(s.familyName)}">
        <label>Tagline</label><input id="sTag" maxlength="60" value="${esc(s.tagline)}">
        <label>What to call the points</label><input id="sPts" maxlength="20" value="${esc(s.pointsName)}">
        <label>Main color</label><input id="sColor" type="color" value="${esc(s.accent)}">
        <label>Peace Board actions (one per line: <i>text | points</i>)</label>
        <textarea id="sActs" rows="6">${esc(state.peaceActs.map(a => a.label + ' | ' + a.pts).join('\n'))}</textarea>
        <button style="width:100%;margin-top:12px" data-act="saveSettings">Save (parent PIN)</button>
      </div>

      <h2>Phone storage</h2>
      <div class="panel" id="storagePanel"><p class="muted">Checking…</p></div>

      <h2>Move to another phone</h2>
      <div class="panel">
        <p class="muted">Save a backup file, then open it on the other phone to copy everything over.</p>
        <div class="row">
          <button class="ghost" data-act="export">Save backup</button>
          <button class="ghost" data-act="import">Load backup</button>
        </div>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>

      <h2>Install on your phone</h2>
      <div class="panel">
        <p class="muted" style="margin-top:0"><b>iPhone:</b> Safari → Share → <i>Add to Home Screen</i>.<br>
        <b>Android:</b> Chrome → ⋮ menu → <i>Install app</i> / <i>Add to Home screen</i>.</p>
        <button id="installBtn" style="width:100%" hidden>Install app</button>
      </div>

      <h2>Danger zone</h2>
      <div class="panel">
        <div class="row">
          <button class="danger" data-act="clearLog">Clear history</button>
          <button class="danger" data-act="reset">Erase everything</button>
        </div>
      </div>`;
    },
  };

  let shopKid = null;

  function recentLog() {
    const items = state.log.slice(0, 8);
    if (!items.length) return '';
    return `<h2>Recent</h2><div class="panel">${items.map(l => `<div class="list-item spread">
      <span>${esc(kidById(l.kidId)?.avatar || '')} ${esc(l.text)}<br><span class="muted">${fmtDate(l.at)}</span></span>
      <b style="flex:0 0 auto;color:${l.pts >= 0 ? 'var(--ok)' : 'var(--warn)'}">${l.pts >= 0 ? '+' : ''}${l.pts}</b></div>`).join('')}</div>`;
  }

  async function renderStorage() {
    const el = $('#storagePanel');
    if (!el) return;
    const appBytes = (localStorage.getItem(STORE_KEY) || '').length * 2;
    let quota = null, usage = null;
    try { if (navigator.storage?.estimate) ({ quota, usage } = await navigator.storage.estimate()); } catch {}
    const cap = Math.min(STORAGE_CAP, quota || STORAGE_CAP);
    const pct = Math.min(100, ((usage || appBytes) / cap) * 100);
    el.innerHTML = `
      <div class="spread"><span>App data</span><b>${fmtBytes(appBytes)}</b></div>
      ${usage != null ? `<div class="spread"><span>App total (incl. offline copy)</span><b>${fmtBytes(usage)}</b></div>` : ''}
      <div class="spread"><span>Limit</span><b>under 1 GB</b></div>
      <div class="bar" style="margin-top:8px"><div style="width:${Math.max(pct, 0.5)}%"></div></div>
      <p class="muted" style="margin-bottom:0">The whole app is about 40 KB. Your family data stays on this phone and is kept well under 1 GB.
      ${appBytes > APP_DATA_WARN ? '<br><b style="color:var(--warn)">Getting full — clear history or save a backup.</b>' : ''}</p>`;
  }

  function render() {
    applyTheme();
    document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    $('#view').innerHTML = views[tab]();
    if (tab === 'settings') { renderStorage(); if (deferredInstall) $('#installBtn').hidden = false; }
  }

  // ---------- Actions ----------
  const actions = {
    unlock: async () => { if (await unlockParent()) render(); },
    lock: () => { parentUnlocked = false; render(); },
    goShop: el => { shopKid = el.dataset.id; tab = 'cards'; render(); },
    openWallet(el) {
      const k = kidById(el.dataset.id);
      const items = state.wallet.filter(w => w.kidId === k.id);
      $('#view').innerHTML = `<button class="ghost small" data-act="back">← Back</button>
        <h2>${esc(k.avatar)} ${esc(k.name)}'s wallet</h2>` +
        (items.map(w => `<div class="gcard" style="background:${esc(w.color)};${w.used ? 'opacity:.5' : ''}">
          <div class="emoji">${esc(w.emoji)}</div>
          <div><div class="title">${esc(w.title)}</div>
          <div class="code">${esc(w.code)}</div>
          <div style="font-size:.8rem;opacity:.9">${w.used ? 'Used' : 'Ready to use'} · got it ${fmtDate(w.at)}</div></div>
        </div>`).join('') || '<div class="panel empty">No gift cards yet. Earn points on the Peace Board!</div>');
    },
    back: () => render(),

    async redeem(el) {
      const c = cardById(el.dataset.id);
      const k = kidById(shopKid);
      if (!c || !k || k.points < c.cost || c.stock === 0) return;
      if (!confirm(`Spend ${c.cost} points on "${c.title}" for ${k.name}?`)) return;
      k.points -= c.cost;
      if (c.stock > 0) c.stock--;
      state.wallet.unshift({ id: uid(), kidId: k.id, cardId: c.id, title: c.title, emoji: c.emoji, color: c.color, code: giftCode(), at: Date.now(), used: false });
      addLog(k.id, `${k.name} got "${c.title}"`, -c.cost);
      save(); toast(`🎉 ${c.title} added to ${k.name}'s wallet`); render();
    },

    async peace(el) {
      const a = state.peaceActs[+el.dataset.i];
      const k = kidById($('#peaceKid').value);
      if (!a || !k) return;
      if (!(await unlockParent())) return;
      k.points += a.pts;
      addLog(k.id, `${k.name}: ${a.label}`, a.pts);
      save(); toast(`+${a.pts} for ${k.name} 🕊️`); render();
    },
    async makePeace() {
      const a = kidById($('#peaceA').value), b = kidById($('#peaceB').value);
      if (!a || !b || a === b) { toast('Pick two different kids'); return; }
      if (!(await unlockParent())) return;
      a.points += 10; b.points += 10;
      addLog(a.id, `${a.name} made peace with ${b.name}`, 10);
      addLog(b.id, `${b.name} made peace with ${a.name}`, 10);
      save(); toast('🤝 Peace made! +10 each'); render();
    },

    addKid() {
      const name = $('#kName').value.trim();
      const age = parseInt($('#kAge').value, 10);
      const avatar = $('#kAvatar .sel')?.dataset.v || '🌟';
      if (!name) return toast('Type a name');
      if (!(age >= MIN_AGE && age <= MAX_AGE)) return toast(`Age must be ${MIN_AGE}–${MAX_AGE}`);
      state.kids.push({ id: uid(), name, age, avatar, points: 0 });
      save(); toast(`${name} added`); render();
    },
    editKid(el) {
      const k = kidById(el.dataset.id);
      const name = prompt('Name', k.name); if (name === null) return;
      const ageStr = prompt(`Age (${MIN_AGE}–${MAX_AGE})`, k.age); if (ageStr === null) return;
      const age = parseInt(ageStr, 10);
      if (!(age >= MIN_AGE && age <= MAX_AGE)) return toast(`Age must be ${MIN_AGE}–${MAX_AGE}`);
      if (!name.trim()) {
        if (confirm(`Remove ${k.name} and their wallet?`)) {
          state.kids = state.kids.filter(x => x.id !== k.id);
          state.wallet = state.wallet.filter(w => w.kidId !== k.id);
        }
      } else { k.name = name.trim().slice(0, 24); k.age = age; }
      save(); render();
    },
    adjust(el) {
      const k = kidById(el.dataset.id);
      const v = prompt(`Add or take away points for ${k.name} (e.g. 20 or -10)`, '10');
      const n = parseInt(v, 10);
      if (!n) return;
      k.points = Math.max(0, k.points + n);
      addLog(k.id, `Parent ${n > 0 ? 'bonus' : 'adjustment'} for ${k.name}`, n);
      save(); render();
    },
    addCard() {
      const title = $('#cTitle').value.trim();
      const cost = parseInt($('#cCost').value, 10);
      const stockIn = parseInt($('#cStock').value, 10) || 0;
      let minAge = parseInt($('#cMin').value, 10), maxAge = parseInt($('#cMax').value, 10);
      if (!title) return toast('Name the gift card');
      if (!(cost > 0)) return toast('Cost must be at least 1');
      minAge = Math.min(MAX_AGE, Math.max(MIN_AGE, minAge || MIN_AGE));
      maxAge = Math.min(MAX_AGE, Math.max(MIN_AGE, maxAge || MAX_AGE));
      if (minAge > maxAge) [minAge, maxAge] = [maxAge, minAge];
      state.cards.push({
        id: uid(), title, cost, note: $('#cNote').value.trim(),
        emoji: $('#cEmoji .sel')?.dataset.v || '🎁', color: $('#cColor').value,
        stock: stockIn > 0 ? stockIn : -1, minAge, maxAge,
      });
      save(); toast('Gift card created'); render();
    },
    delCard(el) {
      if (!confirm('Remove this gift card from the shop?')) return;
      state.cards = state.cards.filter(c => c.id !== el.dataset.id);
      save(); render();
    },
    markUsed(el) {
      const w = state.wallet.find(x => x.id === el.dataset.id);
      if (w) { w.used = true; save(); render(); }
    },

    async saveSettings() {
      if (!(await unlockParent())) return;
      const s = state.settings;
      s.appTitle = $('#sTitle').value.trim() || 'Family Gift Cards';
      s.familyName = $('#sFamily').value.trim() || 'Our Family';
      s.tagline = $('#sTag').value.trim();
      s.pointsName = $('#sPts').value.trim() || 'Peace Points';
      s.accent = $('#sColor').value;
      const acts = $('#sActs').value.split('\n').map(line => {
        const [label, p] = line.split('|').map(x => x && x.trim());
        const n = parseInt(p, 10);
        return label && n > 0 ? { label: label.slice(0, 40), pts: Math.min(n, 1000) } : null;
      }).filter(Boolean);
      if (acts.length) state.peaceActs = acts;
      save(); toast('Saved'); render();
    },
    export() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `family-gift-cards-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },
    async import() {
      if (!(await unlockParent())) return;
      const inp = $('#importFile');
      inp.onchange = async () => {
        const f = inp.files[0]; if (!f) return;
        if (f.size > 20 * 1024 * 1024) return toast('That file is too big');
        try {
          const d = JSON.parse(await f.text());
          if (!Array.isArray(d.kids) || !d.settings) throw 0;
          if (!confirm('Replace everything on this phone with the backup?')) return;
          state = { ...defaults(), ...d, settings: { ...defaults().settings, ...d.settings } };
          save(); parentUnlocked = false; toast('Backup loaded'); render();
        } catch { toast('That is not a Family Gift Cards backup'); }
      };
      inp.click();
    },
    async clearLog() {
      if (!(await unlockParent())) return;
      if (!confirm('Clear history and used gift cards?')) return;
      state.log = []; state.wallet = state.wallet.filter(w => !w.used);
      save(); render();
    },
    async reset() {
      if (!(await unlockParent())) return;
      if (!confirm('Erase ALL kids, cards, points and settings on this phone?')) return;
      localStorage.removeItem(STORE_KEY);
      state = defaults(); parentUnlocked = false; render();
    },
  };

  // ---------- Events ----------
  document.addEventListener('click', e => {
    const pick = e.target.closest('.emoji-pick button');
    if (pick) { pick.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('sel')); pick.classList.add('sel'); return; }
    const nav = e.target.closest('#nav button');
    if (nav) {
      tab = nav.dataset.tab;
      if (tab === 'parent' && !parentUnlocked) { render(); unlockParent().then(ok => ok && render()); return; }
      render(); window.scrollTo(0, 0); return;
    }
    const act = e.target.closest('[data-act]');
    if (act && actions[act.dataset.act]) actions[act.dataset.act](act);
    if (e.target.id === 'installBtn' && deferredInstall) { deferredInstall.prompt(); deferredInstall = null; e.target.hidden = true; }
  });
  document.addEventListener('change', e => { if (e.target.id === 'shopKid') { shopKid = e.target.value; render(); } });

  let deferredInstall = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (tab === 'settings') render(); });

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  // Ask the browser not to evict our data when the phone is low on space.
  navigator.storage?.persist?.().catch(() => {});

  render();
})();
</script>
</body>
</html>
