<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c4cf5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Gifts">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Family Gift Cards</title>
<style>
  :root {
    --accent: #6c4cf5;
    --bg: #f6f5fb;
    --card: #ffffff;
    --text: #1d1b26;
    --muted: #6b6880;
    --line: #e4e2ee;
    --ok: #1f9d55;
    --warn: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14131a; --card: #1f1d28; --text: #f2f1f7; --muted: #a3a0b5; --line: #302d3d; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
  }
  header {
    background: var(--accent); color: #fff; padding: 18px 16px 14px;
    padding-top: calc(18px + env(safe-area-inset-top));
  }
  header h1 { margin: 0; font-size: 1.3rem; }
  header p { margin: 2px 0 0; opacity: .85; font-size: .9rem; }
  .badge {
    flex: 0 0 auto; align-self: flex-start; background: rgba(255,255,255,.2); border-radius: 99px;
    padding: 4px 10px; font-size: .75rem; font-weight: 600; white-space: nowrap;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 1.1rem; margin: 20px 0 10px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > * { flex: 1; }
  .spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea {
    width: 100%; padding: 11px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }
  input[type=color] { padding: 2px; height: 44px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 14px;
    background: var(--accent); color: #fff; cursor: pointer; min-height: 44px;
  }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button.danger { background: transparent; color: var(--warn); border: 1px solid var(--line); }
  button.small { padding: 6px 10px; min-height: 34px; font-size: .85rem; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .muted { color: var(--muted); font-size: .9rem; }
  .empty { text-align: center; color: var(--muted); padding: 20px 8px; }
  .kid { display: flex; align-items: center; gap: 12px; }
  .avatar { font-size: 2rem; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%; background: var(--bg); flex: 0 0 52px; }
  .points { font-weight: 700; font-size: 1.2rem; }
  .gcard {
    color: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; position: relative;
    min-height: 130px; display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 6px 18px rgba(0,0,0,.12);
  }
  .gcard .emoji { font-size: 2rem; }
  .gcard .title { font-weight: 700; font-size: 1.15rem; }
  .gcard .cost { position: absolute; top: 14px; right: 14px; background: rgba(0,0,0,.22); padding: 4px 10px; border-radius: 99px; font-weight: 700; }
  .gcard .code { font-family: ui-monospace, monospace; letter-spacing: 1px; opacity: .9; font-size: .85rem; }
  .gcard button { background: rgba(255,255,255,.95); color: #222; }
  .tag { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .list-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list-item:last-child { border-bottom: 0; }
  .codebox {
    font-family: ui-monospace, monospace; font-size: 1.05rem; font-weight: 700; letter-spacing: 1px;
    text-align: center; background: var(--bg); border: 1px dashed var(--line); border-radius: 10px;
    padding: 12px 8px; margin: 10px 0; word-break: break-all; user-select: all;
  }
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 5;
  }
  nav button {
    flex: 1; background: transparent; color: var(--muted); border-radius: 0; font-size: .75rem;
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px; min-height: 60px;
  }
  nav button span { font-size: 1.35rem; }
  nav button.active { color: var(--accent); }
  .bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }
  .toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #222; color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: .9rem; z-index: 20; max-width: 90vw; text-align: center;
  }
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(420px, 92vw); background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog .panel { border: 0; margin: 0; }
  .pinpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .pinpad button { font-size: 1.3rem; background: var(--bg); color: var(--text); border: 1px solid var(--line); }
  .dots { text-align: center; font-size: 1.6rem; letter-spacing: 8px; min-height: 2rem; }
  .emoji-pick { display: flex; flex-wrap: wrap; gap: 6px; }
  .emoji-pick button { background: var(--bg); border: 1px solid var(--line); font-size: 1.4rem; padding: 4px 8px; min-height: 40px; }
  .emoji-pick button.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
</style>
</head>
<body>
<header>
  <div class="spread">
    <div style="min-width:0">
      <h1 id="appTitle">Family Gift Cards</h1>
      <p id="appSub">Earn Peace Points, trade them for gift cards</p>
    </div>
    <span id="syncBadge" class="badge" hidden></span>
  </div>
</header>
<main id="view"></main>

<nav id="nav">
  <button data-tab="home"><span>🏠</span>Home</button>
  <button data-tab="cards"><span>🎁</span>Cards</button>
  <button data-tab="peace"><span>🕊️</span>Peace</button>
  <button data-tab="parent"><span>🔒</span>Parent</button>
  <button data-tab="settings"><span>⚙️</span>Setup</button>
</nav>

<dialog id="pinDialog">
  <div class="panel">
    <h2 style="margin-top:0" id="pinTitle">Parent PIN</h2>
    <div class="dots" id="pinDots"></div>
    <div class="pinpad" id="pinPad"></div>
    <div class="row" style="margin-top:10px">
      <button class="ghost" id="pinCancel">Cancel</button>
    </div>
  </div>
</dialog>

<script>
(() => {
  'use strict';

  // ---------- Sync server ----------
  // A publishable key is meant to be public. The database only answers the gc_* functions
  // (see supabase/schema.sql), and a family's data can only be reached with its family code.
  const SYNC_URL = 'https://seqeuadetaioxuzmcbal.supabase.co';
  const SYNC_KEY = 'sb_publishable_VxZKocXeodCEnQyE_Q2DMw_ZcoRmWnh';
  const SYNC_EVERY = 10 * 1000;          // check for changes from other phones while the app is open
  const SYNC_RETRY = 60 * 1000;          // back off after a server error
  const RELOCK_AFTER = 2 * 60 * 1000;    // parent mode locks after the app is in the background this long

  // ---------- Constants ----------
  const STORE_KEY = 'familyGiftCards.v2';
  const OLD_STORE_KEY = 'familyGiftCards.v1';
  const MAX_AGE = 15;                               // kids profiles are for ages 1–15
  const MIN_AGE = 1;
  const STORAGE_CAP = 1024 * 1024 * 1024 - 1;       // stay under 1 GB
  const APP_DATA_WARN = 4 * 1024 * 1024;            // localStorage usually tops out near 5 MB
  const LOG_MAX = 300;
  const WALLET_MAX = 2000;
  const IMPORT_MAX = 900 * 1024;                    // the server takes events up to 1 MB
  const CODE_ALPHABET = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';   // no I, L, O, U: easy to read aloud
  const CODE_LEN = 25;                              // 125 random bits
  const AVATARS = ['🦁','🐯','🐼','🦊','🐸','🐵','🦄','🐙','🐢','🐬','🚀','⚽','🎨','🎸','🌟','🌈'];
  const CARD_EMOJI = ['🎁','🍦','🎮','📚','🍕','🎬','🧸','🛝','🎟️','🛍️','🏊','🌙','📱','🎨'];
  const PEACE_ACTS = [
    { label: 'Shared with a sibling', pts: 5 },
    { label: 'Said sorry & made up', pts: 10 },
    { label: 'Helped without being asked', pts: 10 },
    { label: 'Solved a fight calmly', pts: 15 },
    { label: 'Did chores', pts: 5 },
    { label: 'Kind words all day', pts: 10 },
  ];

  const defaults = () => ({
    settings: {
      familyName: 'Our Family',
      appTitle: 'Family Gift Cards',
      tagline: 'Earn Peace Points, trade them for gift cards',
      accent: '#6c4cf5',
      pointsName: 'Peace Points',
      pinHash: '',            // empty = no PIN set yet
      pinSalt: '',
    },
    kids: [],                 // {id, name, age, avatar, points}
    cards: [],                // {id, title, emoji, cost, color, minAge, maxAge, stock (-1 = unlimited), note}
    wallet: [],               // {id, kidId, cardId, title, emoji, color, code, at, used}
    log: [],                  // {id, kidId, text, pts, at}
    peaceActs: PEACE_ACTS.map(a => ({ ...a })),
  });

  // ---------- Small helpers ----------
  const $ = s => document.querySelector(s);
  const clone = o => JSON.parse(JSON.stringify(o));
  const randomBytes = n => crypto.getRandomValues(new Uint8Array(n));
  const hex = bytes => Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
  const uid = () => hex(randomBytes(8));
  const uuid = () => {
    const b = randomBytes(16);
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    const h = hex(b);
    return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
  };
  const randomCode = len => Array.from(randomBytes(len), b => CODE_ALPHABET[b & 31]).join('');
  const giftCode = () => randomCode(12).replace(/(.{4})(?!$)/g, '$1-');
  const normalizeCode = s => String(s || '').toUpperCase().replace(/O/g, '0').replace(/[IL]/g, '1').replace(/[^0-9A-Z]/g, '');
  const formatCode = c => c.replace(/(.{5})(?!$)/g, '$1-');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const fmtDate = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const fmtBytes = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : b < 1073741824 ? (b/1048576).toFixed(1) + ' MB' : (b/1073741824).toFixed(2) + ' GB';

  // Input cleaning: every change from another phone passes through these before it touches state.
  const str = (v, max) => typeof v === 'string' ? v.trim().slice(0, max) : '';
  const int = (v, lo, hi) => {
    const n = typeof v === 'number' || (typeof v === 'string' && v.trim() !== '') ? Math.trunc(Number(v)) : NaN;
    return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : null;
  };
  const arr = v => Array.isArray(v) ? v : [];
  const isColor = v => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v);
  const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);

  // SHA-256 for the parent PIN, in plain JS so it also works where crypto.subtle is missing.
  const sha256 = (() => {
    const K = new Uint32Array([
      0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
      0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
      0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
    const rotr = (x, n) => (x >>> n) | (x << (32 - n));
    return text => {
      const data = new TextEncoder().encode(text);
      const total = Math.ceil((data.length + 9) / 64) * 64;
      const buf = new Uint8Array(total);
      buf.set(data); buf[data.length] = 0x80;
      const dv = new DataView(buf.buffer);
      dv.setUint32(total - 8, Math.floor(data.length / 0x20000000));
      dv.setUint32(total - 4, (data.length * 8) >>> 0);
      const H = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
      const W = new Uint32Array(64);
      for (let o = 0; o < total; o += 64) {
        for (let i = 0; i < 16; i++) W[i] = dv.getUint32(o + i * 4);
        for (let i = 16; i < 64; i++) {
          const s0 = rotr(W[i-15], 7) ^ rotr(W[i-15], 18) ^ (W[i-15] >>> 3);
          const s1 = rotr(W[i-2], 17) ^ rotr(W[i-2], 19) ^ (W[i-2] >>> 10);
          W[i] = W[i-16] + s0 + W[i-7] + s1;
        }
        let [a, b, c, d, e, f, g, h] = H;
        for (let i = 0; i < 64; i++) {
          const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
          const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
          h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
        }
        H[0] += a; H[1] += b; H[2] += c; H[3] += d; H[4] += e; H[5] += f; H[6] += g; H[7] += h;
      }
      return Array.from(H, x => x.toString(16).padStart(8, '0')).join('');
    };
  })();
  const hashPin = pin => { const pinSalt = hex(randomBytes(16)); return { pinSalt, pinHash: sha256(pinSalt + ':' + pin) }; };

  // ---------- Cleaning stored or synced data ----------
  function cleanKid(k) {
    if (!isObj(k)) return null;
    const id = str(k.id, 40), name = str(k.name, 24), age = Number(k.age);
    if (!id || !name || !Number.isInteger(age) || age < MIN_AGE || age > MAX_AGE) return null;
    return { id, name, age, avatar: str(k.avatar, 16) || '🌟', points: int(k.points, 0, 1e6) ?? 0 };
  }
  function cleanCard(c) {
    if (!isObj(c)) return null;
    const id = str(c.id, 40), title = str(c.title, 40), cost = int(c.cost, 1, 1e6);
    if (!id || !title || cost === null) return null;
    let minAge = int(c.minAge, MIN_AGE, MAX_AGE) ?? MIN_AGE, maxAge = int(c.maxAge, MIN_AGE, MAX_AGE) ?? MAX_AGE;
    if (minAge > maxAge) [minAge, maxAge] = [maxAge, minAge];
    return {
      id, title, cost, minAge, maxAge,
      stock: int(c.stock, -1, 10000) ?? -1,
      note: str(c.note, 80),
      emoji: str(c.emoji, 16) || '🎁',
      color: isColor(c.color) ? c.color : '#6c4cf5',
    };
  }
  function cleanWallet(w) {
    if (!isObj(w)) return null;
    const id = str(w.id, 40), kidId = str(w.kidId, 40);
    if (!id || !kidId) return null;
    return {
      id, kidId, cardId: str(w.cardId, 40), title: str(w.title, 40) || 'Gift card', emoji: str(w.emoji, 16) || '🎁',
      color: isColor(w.color) ? w.color : '#6c4cf5', code: str(w.code, 20), at: int(w.at, 0, 8.64e15) ?? 0, used: w.used === true,
    };
  }
  function cleanLog(l) {
    if (!isObj(l)) return null;
    return { id: str(l.id, 60) || uid(), kidId: str(l.kidId, 40), text: str(l.text, 120), pts: int(l.pts, -1e6, 1e6) ?? 0, at: int(l.at, 0, 8.64e15) ?? 0 };
  }
  function cleanAct(a) {
    if (!isObj(a)) return null;
    const label = str(a.label, 40), pts = int(a.pts, 1, 1000);
    return label && pts ? { label, pts } : null;
  }
  function cleanState(d) {
    const s = defaults();
    if (!isObj(d)) return s;
    const ds = isObj(d.settings) ? d.settings : {};
    for (const k of ['familyName', 'appTitle', 'tagline', 'pointsName']) if (typeof ds[k] === 'string') s.settings[k] = str(ds[k], 60);
    if (isColor(ds.accent)) s.settings.accent = ds.accent;
    if (typeof ds.pinHash === 'string' && /^[0-9a-f]{64}$/.test(ds.pinHash)) {
      s.settings.pinHash = ds.pinHash; s.settings.pinSalt = str(ds.pinSalt, 64);
    } else if (typeof ds.pin === 'string' && /^\d{4,6}$/.test(ds.pin)) {
      Object.assign(s.settings, hashPin(ds.pin));     // backups from the first version kept the PIN as-is
    }
    s.kids = arr(d.kids).map(cleanKid).filter(Boolean).slice(0, 50);
    s.cards = arr(d.cards).map(cleanCard).filter(Boolean).slice(0, 200);
    s.wallet = arr(d.wallet).map(cleanWallet).filter(Boolean).slice(0, WALLET_MAX);
    s.log = arr(d.log).map(cleanLog).filter(Boolean).slice(0, LOG_MAX);
    const acts = arr(d.peaceActs).map(cleanAct).filter(Boolean).slice(0, 30);
    if (acts.length) s.peaceActs = acts;
    return s;
  }

  // ---------- Changes ----------
  // Every change is an event. Phones replay the family's events in the server's order,
  // so they all end up with the same state. Rules (like "enough points?") are checked
  // during replay, which is what stops two phones spending the same points twice.
  function addLog(s, ev, kidId, text, p, n = 0) {
    s.log.unshift({ id: ev.id + (n ? ':' + n : ''), kidId, text: str(text, 120), pts: p, at: int(ev.at, 0, 8.64e15) ?? 0 });
    if (s.log.length > LOG_MAX) s.log.length = LOG_MAX;
  }

  function apply(s, ev, onReject) {
    if (!isObj(ev)) return s;
    const kid = id => s.kids.find(k => k.id === id);
    switch (ev.type) {
      case 'settings': {
        const v = isObj(ev.settings) ? ev.settings : {};
        for (const k of ['familyName', 'appTitle', 'tagline', 'pointsName']) if (typeof v[k] === 'string') s.settings[k] = str(v[k], 60);
        if (isColor(v.accent)) s.settings.accent = v.accent;
        break;
      }
      case 'acts': {
        const acts = arr(ev.acts).map(cleanAct).filter(Boolean).slice(0, 30);
        if (acts.length) s.peaceActs = acts;
        break;
      }
      case 'pin':
        if (typeof ev.pinHash === 'string' && /^[0-9a-f]{64}$/.test(ev.pinHash)) {
          s.settings.pinHash = ev.pinHash; s.settings.pinSalt = str(ev.pinSalt, 64);
        }
        break;
      case 'kid.add': {
        const k = cleanKid({ ...(isObj(ev.kid) ? ev.kid : {}), points: 0 });
        if (k && !kid(k.id) && s.kids.length < 50) s.kids.push(k);
        break;
      }
      case 'kid.edit': {
        const k = kid(ev.kidId), c = k && cleanKid({ ...k, name: ev.name, age: ev.age });
        if (c) Object.assign(k, c);
        break;
      }
      case 'kid.remove':
        s.kids = s.kids.filter(k => k.id !== ev.kidId);
        s.wallet = s.wallet.filter(w => w.kidId !== ev.kidId);
        break;
      case 'points': {
        const k = kid(ev.kidId), n = int(ev.pts, -1e6, 1e6);
        if (!k || !n) break;
        const before = k.points;
        k.points = Math.min(1e6, Math.max(0, k.points + n));
        addLog(s, ev, k.id, ev.text, k.points - before);
        break;
      }
      case 'card.add': {
        const c = cleanCard(ev.card);
        if (c && !s.cards.some(x => x.id === c.id) && s.cards.length < 200) s.cards.push(c);
        break;
      }
      case 'card.remove':
        s.cards = s.cards.filter(c => c.id !== ev.cardId);
        break;
      case 'redeem': {
        const k = kid(ev.kidId), c = s.cards.find(x => x.id === ev.cardId), walletId = str(ev.walletId, 40);
        if (!k || !c || !walletId || s.wallet.some(w => w.id === walletId)) break;
        if (c.stock === 0 || k.points < c.cost || k.age < c.minAge || k.age > c.maxAge) {
          addLog(s, ev, k.id, `${k.name} couldn't get "${c.title}"`, 0);
          onReject?.(ev, `${k.name} couldn't get "${c.title}": the points or cards were already used on another phone.`);
          break;
        }
        k.points -= c.cost;
        if (c.stock > 0) c.stock--;
        s.wallet.unshift({ id: walletId, kidId: k.id, cardId: c.id, title: c.title, emoji: c.emoji, color: c.color,
                           code: str(ev.code, 20), at: int(ev.at, 0, 8.64e15) ?? 0, used: false });
        if (s.wallet.length > WALLET_MAX) s.wallet = s.wallet.filter((w, i) => i < WALLET_MAX || !w.used);
        addLog(s, ev, k.id, `${k.name} got "${c.title}"`, -c.cost);
        break;
      }
      case 'used': {
        const w = s.wallet.find(x => x.id === ev.walletId);
        if (w) w.used = true;
        break;
      }
      case 'clear':
        s.log = [];
        s.wallet = s.wallet.filter(w => !w.used);
        break;
      case 'import': {
        const next = cleanState(ev.state);
        if (!next.settings.pinHash) Object.assign(next.settings, { pinHash: s.settings.pinHash, pinSalt: s.settings.pinSalt });
        s = next;
        break;
      }
      case 'reset': {
        const { pinHash, pinSalt } = s.settings;
        s = defaults();
        Object.assign(s.settings, { pinHash, pinSalt });
        break;
      }
    }
    return s;
  }

  // ---------- Stored data ----------
  // store.base    = state after every event the server has confirmed (up to store.sync.cursor)
  // store.pending = changes made on this phone that the server hasn't confirmed yet
  // state         = base + pending, which is what the screen shows
  let store = loadStore();
  let state = null;
  recompute();

  function loadStore() {
    let st = null;
    try { st = JSON.parse(localStorage.getItem(STORE_KEY)); } catch {}
    if (!isObj(st) || !isObj(st.base)) {
      let old = null;
      try { old = JSON.parse(localStorage.getItem(OLD_STORE_KEY)); } catch {}
      st = { base: old };
    }
    const out = {
      device: typeof st.device === 'string' && /^[0-9a-f-]{36}$/.test(st.device) ? st.device : uuid(),
      base: cleanState(st.base),
      pending: arr(st.pending).filter(e => isObj(e) && typeof e.id === 'string' && typeof e.type === 'string'),
      sync: isObj(st.sync) && typeof st.sync.code === 'string' && st.sync.code.length === CODE_LEN
        ? { code: st.sync.code, cursor: int(st.sync.cursor, 0, Number.MAX_SAFE_INTEGER) ?? 0 } : null,
    };
    if (!out.sync) { for (const e of out.pending) out.base = apply(out.base, e); out.pending = []; }
    return out;
  }
  function persist() {
    const json = JSON.stringify(store);
    if (json.length * 2 > STORAGE_CAP) { toast('Too much data. Save a backup and clear old history.'); return false; }
    try {
      localStorage.setItem(STORE_KEY, json);
      localStorage.removeItem(OLD_STORE_KEY);
      return true;
    } catch { toast('Phone storage for this app is full. Clear history in Setup.'); return false; }
  }
  function recompute() {
    let s = clone(store.base);
    for (const e of store.pending) s = apply(s, e);
    state = s;
  }
  function commit(type, data = {}) {
    const ev = { ...data, id: uuid(), type, at: Date.now(), by: store.device };
    if (store.sync) store.pending.push(ev);
    else store.base = apply(store.base, ev);
    persist();
    recompute();
    scheduleSync();
    return ev;
  }

  // ---------- Sync ----------
  const sync = { status: 'idle', error: '', busy: false, again: false, lastTry: 0, timer: 0 };
  const ERRORS = {
    family_not_found: 'This family code isn\'t on the sync server.',
    bad_code: 'That family code isn\'t valid.',
    server_full: 'The sync server has no room for another family.',
    family_full: 'This family\'s sync storage is full.',
  };
  const friendly = e => e.offline ? 'No internet connection.' : (ERRORS[e.message] || 'The sync server had a problem. Trying again soon.');

  async function rpc(fn, args) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 20000);
    try {
      let res;
      try {
        res = await fetch(`${SYNC_URL}/rest/v1/rpc/${fn}`, {
          method: 'POST', cache: 'no-store', signal: ctl.signal,
          headers: { apikey: SYNC_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify(args),
        });
      } catch {
        throw Object.assign(new Error('offline'), { offline: true });
      }
      let body = null;
      try { body = await res.json(); } catch {}
      if (!res.ok) throw Object.assign(new Error(body?.message || `HTTP ${res.status}`), { status: res.status });
      return body;
    } finally {
      clearTimeout(timer);
    }
  }

  const refusedEvent = e => ['bad_event', 'bad_events', 'too_big'].includes(e.message);

  async function pushPending(link) {
    const list = store.pending.slice();
    const send = events => rpc('gc_push', { p_secret: link.code, p_device: store.device, p_events: events });
    for (let i = 0; i < list.length;) {
      const batch = [];
      let size = 0;
      while (i < list.length && batch.length < 100) {
        const n = JSON.stringify(list[i]).length;
        if (batch.length && size + n > 800 * 1024) break;
        batch.push(list[i]); size += n; i++;
      }
      try {
        await send(batch);
      } catch (e) {
        if (!refusedEvent(e)) throw e;
        // The server refused something in this batch: send them one by one and drop what it refuses.
        for (const ev of batch) {
          try { await send([ev]); }
          catch (e2) {
            if (!refusedEvent(e2)) throw e2;
            if (store.sync !== link) return;
            store.pending = store.pending.filter(p => p.id !== ev.id);
            persist();
            toast('One change was too big to sync and was undone.');
          }
        }
      }
      if (store.sync !== link) return;
    }
  }

  async function pullAll(link) {
    for (let page = 0; page < 10000; page++) {
      const r = await rpc('gc_pull', { p_secret: link.code, p_after: link.cursor, p_limit: 500 });
      if (store.sync !== link) return;            // left or switched family meanwhile
      const events = arr(r?.events);
      const confirmed = new Set();
      for (const e of events) {
        if (!(e?.seq > link.cursor)) continue;
        store.base = apply(store.base, e.body, (ev, msg) => { if (ev.by === store.device) toast(msg); });
        link.cursor = e.seq;
        if (typeof e.body?.id === 'string') confirmed.add(e.body.id);
      }
      if (confirmed.size) store.pending = store.pending.filter(p => !confirmed.has(p.id));
      if (events.length) persist();
      if (!events.length || link.cursor >= (r?.last_seq || 0)) return;
    }
  }

  async function syncNow() {
    const link = store.sync;
    if (!link) return;
    if (sync.busy) { sync.again = true; return; }
    sync.busy = true;
    sync.lastTry = Date.now();
    const before = JSON.stringify(state);
    setSyncStatus('syncing');
    try {
      if (store.pending.length) await pushPending(link);
      await pullAll(link);
      if (store.sync === link) setSyncStatus('ok');
    } catch (e) {
      if (store.sync === link) setSyncStatus(e.offline ? 'offline' : 'error', friendly(e));
    } finally {
      sync.busy = false;
      recompute();
      if (JSON.stringify(state) !== before) render(true);
      if (sync.again) { sync.again = false; scheduleSync(0); }
    }
  }

  function scheduleSync(delay = 400) {
    if (!store.sync) return;
    clearTimeout(sync.timer);
    sync.timer = setTimeout(syncNow, delay);
  }

  function setSyncStatus(status, error = '') {
    sync.status = status;
    sync.error = error;
    updateBadge();
    const el = $('#syncStatusText');
    if (el) el.textContent = syncStatusText();
  }
  function syncStatusText() {
    const waiting = store.pending.length;
    switch (sync.status) {
      case 'ok': return waiting ? `Sending ${waiting} change${waiting === 1 ? '' : 's'}…` : 'Up to date ✓';
      case 'syncing': return 'Syncing…';
      case 'offline': return `Offline. ${waiting} change${waiting === 1 ? '' : 's'} will sync later`;
      case 'error': return sync.error;
      default: return 'Connecting…';
    }
  }
  function updateBadge() {
    const b = $('#syncBadge');
    if (!store.sync) { b.hidden = true; return; }
    b.hidden = false;
    b.textContent = { ok: '✓ Synced', syncing: '⟳ Syncing', offline: '☁ Offline', error: '⚠ Sync issue' }[sync.status] || '⟳ Syncing';
  }

  // ---------- Screen helpers ----------

  let showCode = false;

  let walletKid = null;
  let hiddenAt = 0;

  let renderRetry = 0;

  const cardById = id => state.cards.find(c => c.id === id);

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }
  function applyTheme() {
    const s = state.settings;
    document.documentElement.style.setProperty('--accent', s.accent);
    document.querySelector('meta[name=theme-color]').setAttribute('content', s.accent);
    $('#appTitle').textContent = s.appTitle;
    $('#appSub').textContent = s.familyName + ' · ' + s.tagline;

  }

  // ---------- PIN ----------
  function askPin(title) {
    return new Promise(resolve => {
      const dlg = $('#pinDialog');
      if (dlg.open) { resolve(null); return; }
      let entry = '';
      $('#pinTitle').textContent = title;
      const dots = () => $('#pinDots').textContent = '•'.repeat(entry.length) || ' ';
      const pad = $('#pinPad');
      pad.innerHTML = '';
      ['1','2','3','4','5','6','7','8','9','⌫','0','OK'].forEach(k => {
        const b = document.createElement('button');
        b.textContent = k;
        b.onclick = () => {
          if (k === '⌫') entry = entry.slice(0, -1);
          else if (k === 'OK') { dlg.close(); resolve(entry); return; }
          else if (entry.length < 6) entry += k;
          dots();
        };
        pad.appendChild(b);
      });
      $('#pinCancel').onclick = () => { dlg.close(); resolve(null); };
      dlg.oncancel = () => resolve(null);
      dots();
      dlg.showModal();
    });
  }
  async function newPin() {
    const p1 = await askPin('Create a 4–6 digit parent PIN');
    if (!p1) return false;
    if (p1.length < 4) { toast('PIN needs at least 4 digits'); return false; }
    const p2 = await askPin('Type the PIN again');
    if (p1 !== p2) { toast('PINs did not match'); return false; }
    commit('pin', hashPin(p1));
    return true;
  }
  async function unlockParent() {
    if (parentUnlocked) return true;
    if (!state.settings.pinHash) {
      if (!(await newPin())) return false;
      parentUnlocked = true; toast('Parent PIN saved'); return true;
    }
    const p = await askPin('Parent PIN');
    if (p !== null && sha256(state.settings.pinSalt + ':' + p) === state.settings.pinHash) { parentUnlocked = true; return true; }
    if (p !== null) toast('Wrong PIN');
    return false;
  }

      <div class="panel">
        ${state.wallet.filter(w => !w.used).map(w => `<div class="list-item spread">
          <span>${esc(w.emoji)} ${esc(w.title)}<br><span class="muted">${esc(kidById(w.kidId)?.name || '?')} · ${esc(w.code)}</span></span>
          <button class="small" data-act="markUsed" data-id="${esc(w.id)}">Mark used</button></div>`).join('') || '<p class="muted">Nothing waiting.</p>'}
      </div>`;
    },

    settings() {
      const s = state.settings;
      return `<h2>Sync between phones</h2>
      ${syncPanel()}

      <h2>Customize the app</h2>
      <div class="panel">
        <label for="sTitle">App name</label><input id="sTitle" maxlength="30" value="${esc(s.appTitle)}">
        <label for="sFamily">Family name</label><input id="sFamily" maxlength="30" value="${esc(s.familyName)}">
        <label for="sTag">Tagline</label><input id="sTag" maxlength="60" value="${esc(s.tagline)}">
        <label for="sPts">What to call the points</label><input id="sPts" maxlength="20" value="${esc(s.pointsName)}">
        <label for="sColor">Main color</label><input id="sColor" type="color" value="${esc(s.accent)}">
        <label for="sActs">Peace Board actions (one per line: <i>text | points</i>)</label>
        <textarea id="sActs" rows="6">${esc(state.peaceActs.map(a => a.label + ' | ' + a.pts).join('\n'))}</textarea>
        <button style="width:100%;margin-top:12px" data-act="saveSettings">Save (parent PIN)</button>
        <button class="ghost" style="width:100%;margin-top:8px" data-act="changePin">Change parent PIN</button>
      </div>

      <h2>Phone storage</h2>
      <div class="panel" id="storagePanel"><p class="muted">Checking…</p></div>

      <h2>Backup file</h2>
      <div class="panel">
        <p class="muted" style="margin-top:0">Save a copy of everything as a file, or load one back${store.sync ? ' (loading replaces the data on every synced phone)' : ''}.</p>
        <div class="row">
          <button class="ghost" data-act="export">Save backup</button>
          <button class="ghost" data-act="import">Load backup</button>
        </div>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>

      <h2>Install on your phone</h2>
      <div class="panel">
        <p class="muted" style="margin-top:0"><b>iPhone:</b> Safari → Share → <i>Add to Home Screen</i>.<br>
        <b>Android:</b> Chrome → ⋮ menu → <i>Install app</i> / <i>Add to Home screen</i>.</p>
        <button id="installBtn" style="width:100%" hidden>Install app</button>
      </div>

      <h2>Danger zone</h2>
      <div class="panel">
        <button class="danger" style="width:100%" data-act="clearLog">Clear history${store.sync ? ' (all phones)' : ''}</button>
        ${store.sync ? `
        <button class="danger" style="width:100%;margin-top:8px" data-act="leaveFamily">Stop syncing this phone</button>
        <button class="danger" style="width:100%;margin-top:8px" data-act="reset">Erase everything on all phones</button>`
        : `<button class="danger" style="width:100%;margin-top:8px" data-act="reset">Erase everything</button>`}
      </div>`;
    },
  };

  async function renderStorage() {
    const el = $('#storagePanel');
    if (!el) return;
    const appBytes = (localStorage.getItem(STORE_KEY) || '').length * 2;
    let quota = null, usage = null;
    try { if (navigator.storage?.estimate) ({ quota, usage } = await navigator.storage.estimate()); } catch {}
    const cap = Math.min(STORAGE_CAP, quota || STORAGE_CAP);
    const pct = Math.min(100, ((usage || appBytes) / cap) * 100);
    el.innerHTML = `
      <div class="spread"><span>App data</span><b>${fmtBytes(appBytes)}</b></div>
      ${usage != null ? `<div class="spread"><span>App total (incl. offline copy)</span><b>${fmtBytes(usage)}</b></div>` : ''}
      <div class="spread"><span>Limit</span><b>under 1 GB</b></div>
      <div class="bar" style="margin-top:8px"><div style="width:${Math.max(pct, 0.5)}%"></div></div>
      <p class="muted" style="margin-bottom:0">The whole app is about 60 KB. Each phone keeps its own copy of the family's data, kept well under 1 GB.
      ${appBytes > APP_DATA_WARN ? '<br><b style="color:var(--warn)">Getting full. Clear history or save a backup.</b>' : ''}</p>`;
  }

  // keepInputs: a background sync redraws the screen without wiping what someone is typing
  // and without swapping a button out from under a finger.
  function render(keepInputs = false) {
    const view = $('#view');
    const active = document.activeElement;
    if (keepInputs && (pointerDown || (active && view.contains(active) && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)))) {
      renderWaiting = true;
      applyTheme(); updateBadge();
      clearTimeout(renderRetry);
      renderRetry = setTimeout(() => { if (renderWaiting) render(true); }, 700);
      return;
    }
    renderWaiting = false;
    clearTimeout(renderRetry);
    const saved = keepInputs ? saveInputs(view) : null;
    applyTheme();
    updateBadge();
    document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    view.innerHTML = views[tab]();
    if (saved) restoreInputs(view, saved);
    if (tab === 'settings') { renderStorage(); if (deferredInstall) $('#installBtn').hidden = false; }
  }
  // Only fields the person changed are carried over; untouched ones show the newly synced values.
  function saveInputs(root) {
    const values = {}, picks = {};
    root.querySelectorAll('input[id], textarea[id]').forEach(el => { if (el.type !== 'file' && el.value !== el.defaultValue) values[el.id] = el.value; });
    root.querySelectorAll('select[id]').forEach(el => { if (el.selectedOptions[0] && !el.selectedOptions[0].defaultSelected) values[el.id] = el.value; });
    root.querySelectorAll('.emoji-pick[id]').forEach(p => { picks[p.id] = p.querySelector('.sel')?.dataset.v; });
    return { values, picks, scroll: window.scrollY };
  }
  function restoreInputs(root, saved) {
    for (const [id, v] of Object.entries(saved.values)) {
      const el = root.querySelector('#' + CSS.escape(id));
      if (!el || (el.tagName === 'SELECT' && ![...el.options].some(o => o.value === v))) continue;
      el.value = v;
    }
    for (const [id, v] of Object.entries(saved.picks)) {
      root.querySelectorAll(`#${CSS.escape(id)} button`).forEach(b => b.classList.toggle('sel', b.dataset.v === v));
    }
    window.scrollTo(0, saved.scroll);
  }

  // ---------- Actions ----------
  const actions = {
    unlock: async () => { if (await unlockParent()) render(); },
    lock: () => { parentUnlocked = false; showCode = false; render(); },
    goShop: el => { shopKid = el.dataset.id; tab = 'cards'; render(); },
    openWallet: el => { walletKid = el.dataset.id; render(); window.scrollTo(0, 0); },
    back: () => { walletKid = null; render(); },

    redeem(el) {
      const c = cardById(el.dataset.id), k = kidById(shopKid);
      if (!c || !k || k.points < c.cost || c.stock === 0) return;
      if (!confirm(`Spend ${c.cost} points on "${c.title}" for ${k.name}?`)) return;
      const ev = commit('redeem', { walletId: uid(), kidId: k.id, cardId: c.id, code: giftCode() });
      if (state.wallet.some(w => w.id === ev.walletId)) toast(`🎉 ${c.title} added to ${k.name}'s wallet`);
      else toast(`Couldn't get ${c.title}`);
      render();
    },

    async peace(el) {
      const a = state.peaceActs[+el.dataset.i];
      const kidId = $('#peaceKid').value;
      if (!a || !kidById(kidId)) return;
      if (!(await unlockParent())) return;
      const k = kidById(kidId);
      if (!k) return;
      commit('points', { kidId: k.id, pts: a.pts, text: `${k.name}: ${a.label}` });
      toast(`+${a.pts} for ${k.name} 🕊️`); render();
    },
    async makePeace() {
      const aId = $('#peaceA').value, bId = $('#peaceB').value;
      if (!aId || aId === bId) { toast('Pick two different kids'); return; }
      if (!(await unlockParent())) return;
      const a = kidById(aId), b = kidById(bId);
      if (!a || !b) return;
      commit('points', { kidId: a.id, pts: 10, text: `${a.name} made peace with ${b.name}` });
      commit('points', { kidId: b.id, pts: 10, text: `${b.name} made peace with ${a.name}` });
      toast('🤝 Peace made! +10 each'); render();
    },

    addKid() {
      const name = $('#kName').value.trim();
      const age = Number($('#kAge').value);
      const avatar = $('#kAvatar .sel')?.dataset.v || '🌟';
      if (!name) return toast('Type a name');
      if (!Number.isInteger(age) || age < MIN_AGE || age > MAX_AGE) return toast(`Age must be ${MIN_AGE}–${MAX_AGE}`);
      commit('kid.add', { kid: { id: uid(), name, age, avatar } });
      toast(`${name} added`); render();
    },
    editKid(el) {
      const k = kidById(el.dataset.id);
      if (!k) return;
      const name = prompt('Name (leave empty to remove this kid)', k.name); if (name === null) return;
      if (!name.trim()) {
        if (confirm(`Remove ${k.name} and their wallet?`)) commit('kid.remove', { kidId: k.id });
        return render();
      }
      const ageStr = prompt(`Age (${MIN_AGE}–${MAX_AGE})`, k.age); if (ageStr === null) return;
      const age = Number(ageStr);
      if (!Number.isInteger(age) || age < MIN_AGE || age > MAX_AGE) return toast(`Age must be ${MIN_AGE}–${MAX_AGE}`);
      commit('kid.edit', { kidId: k.id, name: name.trim().slice(0, 24), age });
      render();
    },
    adjust(el) {
      const k = kidById(el.dataset.id);
      if (!k) return;
      const v = prompt(`Add or take away points for ${k.name} (e.g. 20 or -10)`, '10');
      const n = int(v, -1e6, 1e6);
      if (!n) return;
      commit('points', { kidId: k.id, pts: n, text: `Parent ${n > 0 ? 'bonus' : 'adjustment'} for ${k.name}` });
      render();
    },
    addCard() {
      const title = $('#cTitle').value.trim();
      const cost = int($('#cCost').value, 0, 1e6);
      const stock = int($('#cStock').value, 0, 10000) || 0;
      let minAge = int($('#cMin').value, MIN_AGE, MAX_AGE) ?? MIN_AGE, maxAge = int($('#cMax').value, MIN_AGE, MAX_AGE) ?? MAX_AGE;
      if (!title) return toast('Name the gift card');
      if (!cost) return toast('Cost must be at least 1');
      if (minAge > maxAge) [minAge, maxAge] = [maxAge, minAge];
      commit('card.add', { card: {
        id: uid(), title, cost, note: $('#cNote').value.trim(),
        emoji: $('#cEmoji .sel')?.dataset.v || '🎁', color: $('#cColor').value,
        stock: stock > 0 ? stock : -1, minAge, maxAge,
      } });
      toast('Gift card created'); render();
    },
    delCard(el) {
      if (!confirm('Remove this gift card from the shop?')) return;
      commit('card.remove', { cardId: el.dataset.id });
      render();
    },
    markUsed(el) {
      commit('used', { walletId: el.dataset.id });
      render();
    },

    async saveSettings() {
      if (!(await unlockParent())) return;
      const next = {
        appTitle: $('#sTitle').value.trim() || 'Family Gift Cards',
        familyName: $('#sFamily').value.trim() || 'Our Family',
        tagline: $('#sTag').value.trim(),
        pointsName: $('#sPts').value.trim() || 'Peace Points',
        accent: $('#sColor').value,
      };
      const changed = Object.fromEntries(Object.entries(next).filter(([k, v]) => state.settings[k] !== v));
      if (Object.keys(changed).length) commit('settings', { settings: changed });
      const acts = $('#sActs').value.split('\n').map(line => {
        const [label, p] = line.split('|').map(x => x && x.trim());
        return cleanAct({ label, pts: int(p, 1, 1000) });
      }).filter(Boolean).slice(0, 30);
      if (acts.length && JSON.stringify(acts) !== JSON.stringify(state.peaceActs)) commit('acts', { acts });
      toast('Saved'); render();
    },
    async changePin() {
      if (!(await unlockParent())) return;
      if (await newPin()) toast('New PIN saved');
    },

    export() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `family-gift-cards-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },
    async import() {
      if (!(await unlockParent())) return;
      const inp = $('#importFile');
      inp.value = '';
      inp.onchange = async () => {
        const f = inp.files[0]; if (!f) return;
        if (f.size > 20 * 1024 * 1024) return toast('That file is too big');
        let d;
        try {
          d = JSON.parse(await f.text());
          if (!isObj(d) || !Array.isArray(d.kids) || !isObj(d.settings)) throw 0;
        } catch { return toast('That is not a Family Gift Cards backup'); }
        const next = cleanState(d);
        if (store.sync && JSON.stringify(next).length > IMPORT_MAX) return toast('That backup is too big to sync. Clear its history first.');
        if (!confirm(store.sync ? 'Replace everything on ALL synced phones with the backup?' : 'Replace everything on this phone with the backup?')) return;
        commit('import', { state: next });
        parentUnlocked = false; showCode = false; toast('Backup loaded'); render();
      };
      inp.click();
    },
    async clearLog() {
      if (!(await unlockParent())) return;
      if (!confirm('Clear history and used gift cards?')) return;
      commit('clear');
      render();
    },
    async reset() {
      if (!(await unlockParent())) return;
      if (store.sync) {
        if (!confirm('Erase ALL kids, cards, points and settings on EVERY synced phone? The parent PIN stays the same.')) return;
        commit('reset');
      } else {
        if (!confirm('Erase ALL kids, cards, points and settings on this phone?')) return;
        store.base = defaults(); store.pending = [];
        persist(); recompute();
        parentUnlocked = false;
      }
      walletKid = null; render();
    },

    // --- sync ---
    async startFamily() {
      if (store.sync) return;
      if (!(await unlockParent())) return;
      const seed = clone(store.base);
      if (JSON.stringify(seed).length > IMPORT_MAX) return toast('Too much history to sync. Clear history first.');
      const code = randomCode(CODE_LEN);
      setSyncStatus('syncing');
      try { await rpc('gc_create_family', { p_secret: code }); }
      catch (e) { setSyncStatus('idle'); return toast(friendly(e)); }
      if (store.sync) return;
      // The family starts from this phone's data: one "import" change with everything in it.
      store.sync = { code, cursor: 0 };
      store.pending = [{ id: uuid(), type: 'import', at: Date.now(), by: store.device, state: seed }];
      store.base = defaults();
      persist(); recompute();
      showCode = true;
      render();
      syncNow();
      toast('Syncing is on. Add your other phones with the family code.');
    },
    async joinFamily(el, rawCode) {
      const code = normalizeCode(rawCode ?? $('#joinCode')?.value);
      if (code.length !== CODE_LEN) return toast('A family code has 25 letters and numbers.');
      if (store.sync?.code === code) return toast('This phone is already in that family.');
      if (state.settings.pinHash && !(await unlockParent())) return;
      const hasData = state.kids.length || state.cards.length;
      const unsent = store.sync && store.pending.length;
      const warn = hasData || store.sync
        ? `Join this family? The kids, cards and points on THIS phone will be replaced by the family's${unsent ? ` (${unsent} unsynced change${unsent === 1 ? '' : 's'} will be lost)` : ''}.`
        : 'Join this family and sync this phone with it?';
      if (!confirm(warn)) return;
      try { await rpc('gc_pull', { p_secret: code, p_after: 0, p_limit: 1 }); }
      catch (e) { return toast(friendly(e)); }
      store.sync = { code, cursor: 0 };
      store.base = defaults();
      store.pending = [];
      parentUnlocked = false; showCode = false; walletKid = null;
      persist(); recompute();
      tab = 'home';
      render();
      await syncNow();
      if (store.sync?.code === code && sync.status === 'ok') toast('Joined! This phone is synced with your family.');
    },
    async revealCode() {
      if (!(await unlockParent())) return;
      showCode = true; render();
    },
    copyCode() {
      const text = formatCode(store.sync.code);
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => toast('Code copied'), () => prompt('Copy this code', text));
      else prompt('Copy this code', text);
    },
    shareCode() {
      const url = `${location.origin}${location.pathname}#join=${formatCode(store.sync.code)}`;
      const text = `Join our ${state.settings.appTitle} on your phone: ${url}`;
      if (navigator.share) navigator.share({ title: state.settings.appTitle, text, url }).catch(() => {});
      else if (navigator.clipboard?.writeText) navigator.clipboard.writeText(url).then(() => toast('Link copied. Send it to the other phone.'), () => prompt('Copy this link', url));
      else prompt('Copy this link', url);
    },
    syncNow: () => syncNow(),
    async leaveFamily() {
      if (!(await unlockParent())) return;
      const unsent = store.pending.length;
      if (!confirm(`Stop syncing this phone? It keeps its own copy, but changes won't reach the other phones anymore${unsent ? ` (${unsent} change${unsent === 1 ? '' : 's'} not sent yet)` : ''}.`)) return;
      store.base = clone(state);
      store.pending = [];
      store.sync = null;
      showCode = false;
      persist(); recompute();
      setSyncStatus('idle');
      render();
    },
  };

  // ---------- Events ----------
  document.addEventListener('click', e => {
    const pick = e.target.closest('.emoji-pick button');
    if (pick) { pick.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('sel')); pick.classList.add('sel'); return; }
    const nav = e.target.closest('#nav button');
    if (nav) {
      tab = nav.dataset.tab; walletKid = null;
      if (tab === 'parent' && !parentUnlocked) { render(); unlockParent().then(ok => ok && render()); return; }
      render(); window.scrollTo(0, 0); return;
    }
    const act = e.target.closest('[data-act]');
    if (act && actions[act.dataset.act]) actions[act.dataset.act](act);
    if (e.target.id === 'installBtn' && deferredInstall) { deferredInstall.prompt(); deferredInstall = null; e.target.hidden = true; }
  });
  document.addEventListener('change', e => { if (e.target.id === 'shopKid') { shopKid = e.target.value; render(); } });
  document.addEventListener('pointerdown', () => { pointerDown = true; }, true);
  for (const type of ['pointerup', 'pointercancel']) {
    document.addEventListener(type, () => { setTimeout(() => { pointerDown = false; }, 0); }, true);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > RELOCK_AFTER && parentUnlocked) {
      parentUnlocked = false; showCode = false; render();
    }
    scheduleSync(0);
  });
  window.addEventListener('online', () => scheduleSync(0));
  window.addEventListener('storage', e => {
    // the app is open in another tab on this phone
    if (e.key === STORE_KEY) { store = loadStore(); recompute(); render(true); }
  });
  setInterval(() => {
    if (!store.sync || document.visibilityState !== 'visible') return;
    if (sync.status === 'error' && Date.now() - sync.lastTry < SYNC_RETRY) return;
    syncNow();
  }, SYNC_EVERY);

  let deferredInstall = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (tab === 'settings') render(true); });

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  // Ask the browser not to evict our data when the phone is low on space.
  navigator.storage?.persist?.().catch(() => {});

  render();
  if (store.sync) syncNow();

  // Opened from a "join our family" link
  const join = location.hash.match(/join=([0-9A-Za-z-]+)/);
  if (join) {
    history.replaceState(null, '', location.pathname + location.search);
    tab = 'settings'; render();
    setTimeout(() => actions.joinFamily(null, join[1]), 300);
  }
})();
</script>
</body>
</html>
